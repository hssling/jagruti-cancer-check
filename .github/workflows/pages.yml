# Publishes index.html (the single-page version of the agent) to GitHub Pages.
# index.html is written without <html>/<head> so it can also be published as a claude.ai Artifact;
# this workflow wraps it in a full document for the open web.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            printf '<meta name="description" content="Teaching prototype of a clinical AI agent for early cancer warning signs in India.">\n'
            printf '</head>\n<body>\n'
            cat index.html
            printf '\n</body>\n</html>\n'
          } > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
